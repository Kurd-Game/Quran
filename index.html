<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - Holy Quran Portal</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           1. CORE DESIGN SYSTEM & VARIABLES
           ========================================================================== */
        :root {
            --primary-gold: #c5a059;
            --primary-gold-dark: #9e7d3b;
            --primary-gold-light: #e5c889;
            --bg-dark-emerald: #0b1d19;
            --bg-card-dark: #122822;
            --bg-card-light: #18332b;
            --text-gold: #f3e5ab;
            --text-light: #e0e8e5;
            --text-muted: #8fa8a0;
            --accent-red: #d9534f;
            --border-gold: rgba(197, 160, 89, 0.3);
            --shadow-gold: 0 4px 20px rgba(197, 160, 89, 0.15);
            --font-quran: 'Amiri', serif;
            --font-ui: 'Cairo', sans-serif;
            --font-title: 'Reem Kufi', sans-serif;
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Light Theme Alternate */
        [data-theme="light"] {
            --bg-dark-emerald: #f4f6f5;
            --bg-card-dark: #ffffff;
            --bg-card-light: #f0f4f2;
            --text-gold: #8a6d29;
            --text-light: #1f2d2a;
            --text-muted: #617871;
            --border-gold: rgba(138, 109, 41, 0.3);
            --shadow-gold: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark-emerald);
            color: var(--text-light);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color var(--transition-smooth), color var(--transition-smooth);
        }

        /* Islamic Geometric Background Pattern */
        .pattern-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--border-gold) 1px, transparent 0);
            background-size: 24px 24px;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        /* ==========================================================================
           2. HEADER & NAVIGATION
           ========================================================================== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 29, 25, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-gold);
            padding: 1rem 2rem;
            transition: background var(--transition-smooth);
        }

        [data-theme="light"] header {
            background: rgba(244, 246, 245, 0.9);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-gold), var(--primary-gold-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-dark-emerald);
            font-size: 1.5rem;
            box-shadow: var(--shadow-gold);
        }

        .brand-title {
            font-family: var(--font-title);
            font-size: 1.6rem;
            color: var(--primary-gold);
            font-weight: 700;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 2.5rem 0.6rem 1rem;
            background: var(--bg-card-dark);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            color: var(--text-light);
            font-family: var(--font-ui);
            font-size: 0.9rem;
            transition: var(--transition-fast);
        }

        .search-box input:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
        }

        .search-box i {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .theme-toggle, .reciter-btn {
            background: var(--bg-card-dark);
            border: 1px solid var(--border-gold);
            color: var(--primary-gold);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: var(--transition-fast);
        }

        .theme-toggle:hover, .reciter-btn:hover {
            background: var(--primary-gold);
            color: var(--bg-dark-emerald);
        }

        /* ==========================================================================
           3. MAIN LAYOUT & SURAH GRID
           ========================================================================== */
        main {
            position: relative;
            z-index: 1;
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .hero-banner {
            text-align: center;
            padding: 3rem 1rem;
            background: linear-gradient(180deg, var(--bg-card-dark) 0%, transparent 100%);
            border-radius: 16px;
            border: 1px solid var(--border-gold);
            margin-bottom: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .hero-banner h1 {
            font-family: var(--font-quran);
            font-size: 3rem;
            color: var(--primary-gold);
            margin-bottom: 0.5rem;
        }

        .hero-banner p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .reciter-selector {
            margin-top: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            background: var(--bg-card-light);
            padding: 0.5rem 1.2rem;
            border-radius: 25px;
            border: 1px solid var(--border-gold);
        }

        .reciter-selector select {
            background: transparent;
            border: none;
            color: var(--text-gold);
            font-family: var(--font-ui);
            font-size: 0.95rem;
            cursor: pointer;
        }

        .surah-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .surah-card {
            background: var(--bg-card-dark);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: var(--transition-fast);
            position: relative;
            overflow: hidden;
        }

        .surah-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary-gold);
            box-shadow: var(--shadow-gold);
            background: var(--bg-card-light);
        }

        .surah-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .surah-number {
            width: 42px;
            height: 42px;
            background: var(--bg-card-light);
            border: 1px solid var(--border-gold);
            color: var(--primary-gold);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            transform: rotate(45deg);
        }

        .surah-number span {
            transform: rotate(-45deg);
        }

        .surah-details h3 {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 0.2rem;
        }

        .surah-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .surah-arabic {
            font-family: var(--font-quran);
            font-size: 1.6rem;
            color: var(--primary-gold);
            font-weight: bold;
        }

        /* ==========================================================================
           4. SURAH VIEW / READING READER
           ========================================================================== */
        .reader-view {
            display: none;
            background: var(--bg-card-dark);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 2.5rem;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        .back-btn {
            background: var(--bg-card-light);
            border: 1px solid var(--border-gold);
            color: var(--text-light);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-ui);
            transition: var(--transition-fast);
        }

        .back-btn:hover {
            background: var(--primary-gold);
            color: var(--bg-dark-emerald);
        }

        .bismillah {
            text-align: center;
            font-family: var(--font-quran);
            font-size: 2.2rem;
            color: var(--primary-gold);
            margin: 1.5rem 0 2.5rem 0;
            line-height: 2;
        }

        .ayahs-container {
            text-align: justify;
            direction: rtl;
            line-height: 2.8;
            font-size: 1.8rem;
            font-family: var(--font-quran);
        }

        .ayah-inline {
            display: inline;
            color: var(--text-light);
            transition: color var(--transition-fast);
        }

        .ayah-inline.active {
            color: var(--primary-gold-light);
            background: rgba(197, 160, 89, 0.15);
            border-radius: 4px;
            padding: 0 4px;
        }

        .ayah-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 0 L93 25 L93 75 L50 100 L7 75 L7 25 Z' fill='none' stroke='%23c5a059' stroke-width='4'/></svg>") no-repeat center center;
            background-size: contain;
            font-size: 0.8rem;
            font-family: var(--font-ui);
            color: var(--primary-gold);
            margin: 0 8px;
            vertical-align: middle;
        }

        /* ==========================================================================
           5. AUDIO PLAYER DOCK (Sticky Bottom)
           ========================================================================== */
        .audio-dock {
            position: sticky;
            bottom: 0;
            z-index: 100;
            background: rgba(18, 40, 34, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-gold);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        [data-theme="light"] .audio-dock {
            background: rgba(255, 255, 255, 0.95);
        }

        .dock-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 200px;
        }

        .dock-info i {
            font-size: 1.8rem;
            color: var(--primary-gold);
        }

        .dock-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-light);
        }

        .dock-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .control-btn:hover {
            color: var(--primary-gold);
        }

        .control-btn.play-main {
            width: 45px;
            height: 45px;
            background: var(--primary-gold);
            color: var(--bg-dark-emerald);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .control-btn.play-main:hover {
            background: var(--primary-gold-light);
        }

        .progress-bar-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 1rem;
            max-width: 600px;
        }

        .time-stamp {
            font-size: 0.8rem;
            color: var(--text-muted);
            width: 40px;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: var(--bg-card-light);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-gold);
            width: 0%;
            border-radius: 3px;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            text-align: center;
            padding: 3rem;
            font-size: 1.5rem;
            color: var(--primary-gold);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-container { flex-direction: column; gap: 1rem; }
            .search-box { width: 100%; }
            .audio-dock { flex-direction: column; gap: 0.8rem; padding: 1rem; }
            .progress-bar-container { width: 100%; }
            .ayahs-container { font-size: 1.4rem; line-height: 2.2; }
        }
    </style>
</head>
<body>

    <div class="pattern-bg"></div>

    <!-- HEADER -->
    <header>
        <div class="header-container">
            <a href="#" class="brand" onclick="showSurahGrid()">
                <div class="brand-logo"><i class="fa-solid fa-quran"></i></div>
                <div class="brand-title">القرآن الكريم</div>
            </a>

            <div class="nav-actions">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="گەڕان بۆ ناوی سوورەت..." oninput="filterSurahs()">
                </div>
                <button class="theme-toggle" id="themeBtn" title="گۆڕینی ڕوکار">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main>
        <!-- HERO / RECITER SELECTION -->
        <div class="hero-banner" id="heroBanner">
            <h1>القرآن الكريم - القارئ الإلكتروني</h1>
            <p>گوێبیستی تلاوەتی قورئانی پیرۆز بە بەرزترین کوالێتی بەدەنگی خوێنەرە بەناوبانگەکان ببە</p>
            <div class="reciter-selector">
                <i class="fa-solid fa-microphone-lines" style="color: var(--primary-gold);"></i>
                <label for="reciterSelect" style="color: var(--text-muted); font-size: 0.9rem;">خوێنەر:</label>
                <select id="reciterSelect" onchange="changeReciter()">
                    <option value="ar.alafasy">مەشاری ڕەشید ئەلعەفاسی (Mishary Rashid Alafasy)</option>
                    <option value="ar.abdulbasitmurattal">عەبدولباسیت عەبدولسەمەد (Abdul Basit)</option>
                    <option value="ar.sudais">عەبدولڕەحمان ئەلسودەیس (Abdul Rahman Al-Sudais)</option>
                    <option value="ar.shaatree">ئەبوبەکر ئەلشاتری (Abu Bakr Al-Shatri)</option>
                    <option value="ar.minshawi">محمد صدی المپنشاوی (Minshawi)</option>
                </select>
            </div>
        </div>

        <!-- SPINNER -->
        <div class="spinner" id="loadingSpinner">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <p style="font-size: 0.9rem; margin-top: 0.5rem; color: var(--text-muted);">تکایە چاوەڕێ بکە...</p>
        </div>

        <!-- SURAH GRID VIEW -->
        <div class="surah-grid" id="surahGrid"></div>

        <!-- SINGLE SURAH READER VIEW -->
        <div class="reader-view" id="readerView">
            <div class="reader-header">
                <button class="back-btn" onclick="showSurahGrid()">
                    <i class="fa-solid fa-arrow-right"></i> گەڕانەوە بۆ لیست
                </button>
                <div style="text-align: center;">
                    <h2 id="readerSurahTitle" style="color: var(--primary-gold); font-family: var(--font-quran); font-size: 2rem;"></h2>
                    <p id="readerSurahMeta" style="color: var(--text-muted); font-size: 0.85rem;"></p>
                </div>
                <div style="width: 100px;"></div> <!-- Spacer -->
            </div>

            <div class="bismillah" id="bismillahText">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
            <div class="ayahs-container" id="ayahsContainer"></div>
        </div>
    </main>

    <!-- AUDIO PLAYER DOCK -->
    <div class="audio-dock">
        <div class="dock-info">
            <i class="fa-solid fa-compact-disc fa-spin" id="discIcon" style="animation-play-state: paused;"></i>
            <div>
                <div class="dock-title" id="playerSurahName">سوورەتێک هەڵبژێرە</div>
                <div class="dock-sub" id="playerReciterName">مەشاری ڕەشید ئەلعەفاسی</div>
            </div>
        </div>

        <div class="audio-controls">
            <button class="control-btn" onclick="prevAyah()"><i class="fa-solid fa-backward-step"></i></button>
            <button class="control-btn play-main" id="playPauseBtn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
            <button class="control-btn" onclick="nextAyah()"><i class="fa-solid fa-forward-step"></i></button>
        </div>

        <div class="progress-bar-container">
            <span class="time-stamp" id="currentTime">00:00</span>
            <div class="progress-bar" id="progressBar" onclick="seekAudio(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time-stamp" id="durationTime">00:00</span>
        </div>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="quranAudio"></audio>

    <!-- ==========================================================================
       6. JAVASCRIPT APPLICATION LOGIC (API Integration & UI Controller)
       ========================================================================== -->
    <script>
        // App State
        let surahsData = [];
        let currentSurahIndex = null;
        let currentAyahIndex = 0;
        let currentAyahsList = [];
        let selectedReciter = 'ar.alafasy';
        let isPlaying = false;

        // DOM Elements
        const surahGrid = document.getElementById('surahGrid');
        const readerView = document.getElementById('readerView');
        const heroBanner = document.getElementById('heroBanner');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const searchInput = document.getElementById('searchInput');
        const themeBtn = document.getElementById('themeBtn');
        const audio = document.getElementById('quranAudio');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const discIcon = document.getElementById('discIcon');

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            fetchSurahs();
            setupAudioEvents();
        });

        // Theme Toggle Logic
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.body.removeAttribute('data-theme');
                themeBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            } else {
                document.body.setAttribute('data-theme', 'light');
                themeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            }
        });

        // 1. Fetch All Surahs List from AlQuran Cloud API
        async function fetchSurahs() {
            showLoading(true);
            try {
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                const result = await response.json();
                if (result.code === 200) {
                    surahsData = result.data;
                    renderSurahGrid(surahsData);
                }
            } catch (error) {
                alert('خەتەکەتا کێشەی هەیە یان پەیوەندی لەدەستچووە.');
                console.error('Error fetching Surahs:', error);
            } finally {
                showLoading(false);
            }
        }

        // 2. Render Surah Cards Grid
        function renderSurahGrid(data) {
            surahGrid.innerHTML = '';
            data.forEach(surah => {
                const card = document.createElement('div');
                card.className = 'surah-card';
                card.onclick = () => loadSurah(surah.number);
                
                card.innerHTML = `
                    <div class="surah-info">
                        <div class="surah-number"><span>${surah.number}</span></div>
                        <div class="surah-details">
                            <h3>${surah.name}</h3>
                            <p>${surah.englishNameTranslation} • ${surah.numberOfAyahs} ئایەت</p>
                        </div>
                    </div>
                    <div class="surah-arabic">${surah.name.replace('سُورَةُ ', '')}</div>
                `;
                surahGrid.appendChild(card);
            });
        }

        // 3. Filter Surahs via Search Input
        function filterSurahs() {
            const query = searchInput.value.toLowerCase().trim();
            const filtered = surahsData.filter(s => 
                s.name.includes(query) || 
                s.englishName.toLowerCase().includes(query) ||
                s.number.toString() === query
            );
            renderSurahGrid(filtered);
        }

        // 4. Load Single Surah Text & Audio
        async function loadSurah(surahNumber) {
            showLoading(true);
            currentSurahIndex = surahNumber;
            currentAyahIndex = 0;

            try {
                // Fetch Surah Audio & Text concurrently using chosen Reciter
                const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/${selectedReciter}`);
                const result = await response.json();

                if (result.code === 200) {
                    const data = result.data;
                    currentAyahsList = data.ayahs;
                    
                    // Display Surah Data
                    document.getElementById('readerSurahTitle').innerText = data.name;
                    document.getElementById('readerSurahMeta').innerText = `${data.revelationType === 'Meccan' ? 'مەککی' : 'مەدەنێ'} • ${data.numberOfAyahs} ئایەت`;
                    
                    // Show Bismillah except for Surah At-Tawbah (9)
                    document.getElementById('bismillahText').style.display = (surahNumber === 9) ? 'none' : 'block';

                    renderAyahs(currentAyahsList);

                    // Switch Views
                    heroBanner.style.display = 'none';
                    surahGrid.style.display = 'none';
                    readerView.style.display = 'block';

                    // Update Player Dock
                    document.getElementById('playerSurahName').innerText = data.name;
                    
                    // Play First Ayah
                    playAyah(0);
                }
            } catch (error) {
                console.error('Error loading Surah:', error);
                alert('نەتوانرا سوورەتەکە باربکرێت.');
            } finally {
                showLoading(false);
            }
        }

        // 5. Render Ayahs Text
        function renderAyahs(ayahs) {
            const container = document.getElementById('ayahsContainer');
            container.innerHTML = '';

            ayahs.forEach((ayah, index) => {
                let text = ayah.text;
                // Remove Bismillah from first Ayah if API includes it (except Surah Al-Fatiha)
                if (index === 0 && currentSurahIndex !== 1 && text.startsWith("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ")) {
                    text = text.replace("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "").trim();
                }

                const ayahSpan = document.createElement('span');
                ayahSpan.className = 'ayah-inline';
                ayahSpan.id = `ayah-${index}`;
                ayahSpan.onclick = () => playAyah(index);
                ayahSpan.innerHTML = `${text} <span class="ayah-badge">${ayah.numberInSurah}</span> `;
                
                container.appendChild(ayahSpan);
            });
        }

        // 6. Play Specific Ayah
        function playAyah(index) {
            if (index < 0 || index >= currentAyahsList.length) return;
            
            // Highlight text
            document.querySelectorAll('.ayah-inline').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`ayah-${index}`);
            if (activeEl) {
                activeEl.classList.add('active');
                activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            currentAyahIndex = index;
            audio.src = currentAyahsList[index].audio;
            audio.play();
            isPlaying = true;
            updatePlayBtnState();
        }

        // 7. Audio Controls Setup
        function setupAudioEvents() {
            audio.addEventListener('ended', () => {
                if (currentAyahIndex + 1 < currentAyahsList.length) {
                    playAyah(currentAyahIndex + 1);
                } else {
                    isPlaying = false;
                    updatePlayBtnState();
                }
            });

            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const pct = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = `${pct}%`;
                    currentTimeEl.innerText = formatTime(audio.currentTime);
                    durationTimeEl.innerText = formatTime(audio.duration);
                }
            });
        }

        function togglePlay() {
            if (!audio.src) return;
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play();
                isPlaying = true;
            }
            updatePlayBtnState();
        }

        function updatePlayBtnState() {
            if (isPlaying) {
                playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                discIcon.style.animationPlayState = 'running';
            } else {
                playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                discIcon.style.animationPlayState = 'paused';
            }
        }

        function nextAyah() {
            if (currentAyahIndex + 1 < currentAyahsList.length) {
                playAyah(currentAyahIndex + 1);
            }
        }

        function prevAyah() {
            if (currentAyahIndex - 1 >= 0) {
                playAyah(currentAyahIndex - 1);
            }
        }

        function seekAudio(e) {
            const rect = e.target.getBoundingClientRect();
            const clickPosition = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = clickPosition * audio.duration;
            }
        }

        function changeReciter() {
            selectedReciter = document.getElementById('reciterSelect').value;
            const reciterNames = {
                'ar.alafasy': 'مەشاری ڕەشید ئەلعەفاسی',
                'ar.abdulbasitmurattal': 'عەبدولباسیت عەبدولسەمەد',
                'ar.sudais': 'عەبدولڕەحمان ئەلسودەیس',
                'ar.shaatree': 'ئەبوبەکر ئەلشاتری',
                'ar.minshawi': 'محمد صدی المپنشاوی'
            };
            document.getElementById('playerReciterName').innerText = reciterNames[selectedReciter];
            if (currentSurahIndex !== null) {
                loadSurah(currentSurahIndex);
            }
        }

        // Utility Helpers
        function showSurahGrid() {
            readerView.style.display = 'none';
            heroBanner.style.display = 'block';
            surahGrid.style.display = 'grid';
            if (audio) {
                audio.pause();
                isPlaying = false;
                updatePlayBtnState();
            }
        }

        function showLoading(show) {
            loadingSpinner.style.display = show ? 'block' : 'none';
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
